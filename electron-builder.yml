appId: com.dextana.desktop
productName: Dextana
executableName: Dextana
asar: true
asarUnpack:
  - node_modules/@trycua/**
  - node_modules/@ubjs/**
beforePack: packaging/before-pack.cjs
npmRebuild: false
electronLanguages: [en-US, en-GB]
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
directories:
  output: release
  buildResources: assets
files:
  - dist/**
  - assets/icon.png
  - package.json
  # Only the Node-facing PDF parser is used. The browser viewers, source maps,
  # type declarations, fonts, and image decoders otherwise add tens of MB to
  # every desktop installation.
  - '!node_modules/pdfjs-dist/build/**'
  - '!node_modules/pdfjs-dist/cmaps/**'
  - '!node_modules/pdfjs-dist/iccs/**'
  - '!node_modules/pdfjs-dist/image_decoders/**'
  - '!node_modules/pdfjs-dist/standard_fonts/**'
  - '!node_modules/pdfjs-dist/types/**'
  - '!node_modules/pdfjs-dist/wasm/**'
  - '!node_modules/pdfjs-dist/web/**'
  - '!node_modules/pdfjs-dist/legacy/image_decoders/**'
  - '!node_modules/pdfjs-dist/legacy/web/**'
  - '!node_modules/pdfjs-dist/legacy/build/*.map'
  - '!node_modules/pdfjs-dist/legacy/build/pdf.sandbox*'
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: browser-extension
    to: browser-extension
    filter:
      [
        manifest.json,
        popup.html,
        popup.css,
        popup.js,
        transfer.js,
        runtime.js,
        site-scope.js,
        site-scope.LICENSE,
        background.js,
        control-worker.js,
        control-session.js,
        control-tabs.js,
        control-actions.js,
        control-screenshot.js,
        screenshot-targeting.js,
        control-page.js,
        page-semantics.js,
        control-popup.js,
      ]
  - from: .build/backend
    to: backend
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  target: [dmg, zip]
  hardenedRuntime: true
  notarize: false
  extendInfo:
    CFBundleGetInfoString: Dextana by Fused
dmg:
  title: Dextana by Fused
  background: assets/dmg-background.png
  iconSize: 144
  iconTextSize: 16
  window:
    width: 720
    height: 480
  contents:
    - x: 184
      y: 267
      type: file
      name: Dextana.app
    - x: 536
      y: 267
      type: link
      path: /Applications
win:
  icon: assets/icon.ico
  target: [nsis, zip]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Dextana
linux:
  icon: assets/icon.png
  category: Office
  target: [AppImage]
