apiVersion: harnest.dev/v1alpha1
kind: Agent
metadata:
  name: dextana-compaction-eval
spec:
  enabled: true
  entrypoint: agent:root_agent
  framework:
    name: adk
    mode: advanced
  runtime:
    version: "3.12"
    dependencyFile: pyproject.toml
  resources:
    cpu: "1"
    memory: 1Gi
    ephemeralStorage: 1Gi
    timeoutSeconds: 300
    maxConcurrentRequests: 1
  scaling:
    minReplicas: 0
    maxReplicas: 1
