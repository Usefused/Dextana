name: Package Dextana
on:
  pull_request:
    paths:
      [
        'src/**',
        'agent/**',
        'assets/**',
        'browser-extension/**',
        'scripts/**',
        'packaging/**',
        'tests/packaged/**',
        'package*.json',
        'electron-builder.yml',
        'playwright.packaged.config.ts',
        '.github/workflows/package.yml',
      ]
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw new Error("Release tag must match package.json version")'
      - run: npm test
      - name: Install pinned build-only compiler
        run: node scripts/install-build-compiler.mjs
      - name: Compile and package the backend and desktop
        run: npm run dist
      - name: Install Linux desktop test libraries
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Test installed app without Harnest or Python on PATH
        if: runner.os != 'Linux'
        run: npm run test:packaged
      - name: Test installed Linux app without Harnest or Python on PATH
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Dextana-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-diagnostics-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: ignore
          path: |
            test-results/packaged/**
            .build/backend-build.log
