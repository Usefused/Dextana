name: Desktop source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:desktop
      - run: npm test
      - run: npm run build
# Full desktop E2E runs require the Harnest CLI and a graphical session.
# See README.md for the local full-flow gate before submitting a change.
