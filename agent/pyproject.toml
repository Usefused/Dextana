[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["croniter>=6,<7", "httpx>=0.28,<0.29", "websockets>=15,<16", "mcp>=1.26,<2", "tzdata>=2026.2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.uv.pip]
# Keep Windows-only dependencies in the same hash-checked locks as macOS/Linux.
universal = true
